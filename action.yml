name: using-agora
description: Review pull requests with parallel OpenRouter reviewers
inputs:
  github-token:
    description: Token with pull request and checks write permissions
    required: true
  openrouter-api-key:
    description: OpenRouter API key for reviewer lanes
    required: true
outputs:
  review-result:
    description: Versioned review result JSON
  run-status:
    description: Review execution status
  verdict:
    description: Review verdict
  reason:
    description: Execution or review reason
  reviewed-head-sha:
    description: Pull request head SHA reviewed
runs:
  using: node24
  main: dist/action.js
